name: Atualizar estatísticas TS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-profile-stats.yml'
      - 'scripts/update_profile_stats.py'
  schedule:
    - cron: '37 9 * * *'

permissions:
  contents: write

concurrency:
  group: ts-profile-stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar SVGs usando API oficial do GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: TsuyoStudio
        run: python scripts/update_profile_stats.py
      - name: Salvar gráficos atualizados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats/*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore(profile): refresh self-hosted statistics'
            git push
          fi
